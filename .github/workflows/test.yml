name: CI

on:
  push:
    branches: ["tailscale"]
  pull_request:
    branches: ["tailscale"]

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: "386"
          - goos: linux
            goarch: loong64
          - goos: linux
            goarch: arm
            goarm: "5"
          - goos: linux
            goarch: arm
            goarm: "7"
          # macOS
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          # Windows
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          # Android core packages (CGO-free build)
          - goos: android
            goarch: arm64
          - goos: android
            goarch: amd64
          # BSDs
          - goos: freebsd
            goarch: amd64
          - goos: openbsd
            goarch: amd64
    steps:
    - name: checkout
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - name: setup go
      uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
      with:
        go-version-file: go.mod
    - name: build
      if: matrix.goos != 'android'
      # The optional Outline adapter depends on a CGO-only DNS helper on Unix,
      # while this matrix intentionally validates CGO-free core builds. The
      # native test job below still builds and tests Outline with CGO enabled.
      run: >-
        go build
        .
        ./cmd/check-lockorder
        ./conn
        ./conn/bindtest
        ./device
        ./ipc
        ./ratelimiter
        ./replay
        ./rwcancel
        ./tai64n
        ./tun
        ./tun/netstack
        ./tun/tuntest
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        GOARM: ${{ matrix.goarm }}
        CGO_ENABLED: "0"
    - name: build Android core
      if: matrix.goos == 'android'
      run: go build ./conn ./device ./tun ./ipc
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        CGO_ENABLED: "0"

  test:
    runs-on: ubuntu-22.04
    steps:
    - name: checkout
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - name: setup go
      uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
      with:
        go-version-file: go.mod
    - name: install cross-binutils
      # arm-linux-gnueabihf-as / -objcopy are needed by
      # TestNEONEncoderAgainstGAS in tsasm/arm/regen as the gold
      # reference for the pure-Perl NEON encoder. (The production
      # regen pipeline no longer touches the cross-as.)
      run: sudo apt-get install -y binutils-arm-linux-gnueabihf
    - name: test
      run: go test -race -v ./...

  check-lockorder:
    runs-on: ubuntu-22.04
    steps:
    - name: checkout
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - name: setup go
      uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
      with:
        go-version-file: go.mod
    - name: check-lockorder
      run: go run ./cmd/check-lockorder

  test-windows-sockets:
    runs-on: windows-2022
    steps:
    - name: checkout
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - name: setup go
      uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
      with:
        go-version-file: go.mod
    - name: test Windows socket handles
      run: go test -race ./conn

  build-ios-core:
    runs-on: macos-15
    steps:
    - name: checkout
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - name: setup go
      uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
      with:
        go-version-file: go.mod
    - name: compile iOS core and tests
      run: >-
        GOOS=ios GOARCH=arm64 CGO_ENABLED=1
        go test -run '^$' -exec=/usr/bin/true
        ./conn ./device ./tun ./ipc
